# 本仓库**不做成安装包**：拉下来就是项目，直接在里面开发。
# pyproject 只用来声明第三方依赖（uv sync / pip install -r 都能用）与测试配置。

[project]
name = "webx"
version = "0.1.0"
description = "通用 Sanic Web 项目骨架：自动蓝图路由 + 层级中间件 + 加密令牌 + ORM 表结构同步"
requires-python = ">=3.11"
dependencies = [
    "sanic>=25.12.1",
    "sanic-ext>=25.12.0",
    "tortoise-orm[asyncpg]>=1.1.7",
    "environs>=15.0.1",
    # DTO 校验：sanic_ext.validate 的后端
    "pydantic>=2.13.4",
    # 短信适配层（webx/lib/sms）的 HTTP 客户端；手机号是基础能力，故为主依赖
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# 开发/测试
dev = ["pytest>=8", "pytest-asyncio>=1", "sanic-testing>=24"]

[tool.uv]
# 关键：只装依赖，不把本仓库当成包去构建安装。
# 代码靠 cwd / sys.path 直接 import，改完即生效，不需要重新安装。
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
